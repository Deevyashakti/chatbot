    // ---- @mentions ----
    // Typing @name in the body suggests contacts; picking one tags them and adds them to To.
    var mentionRange = null;

    function checkMention() {
        var sel = window.getSelection();
        if (!sel.rangeCount || !sel.isCollapsed) { hideSuggestions(); return; }
        var node = sel.anchorNode;
        if (!node || node.nodeType !== Node.TEXT_NODE || !editor.contains(node)) { hideSuggestions(); return; }
        var before = node.textContent.slice(0, sel.anchorOffset);
        var match = before.match(/(^|\s)@([\w.\-+]*)$/);
        if (!match) { hideSuggestions(); return; }

        var start = sel.anchorOffset - match[2].length - 1;
        mentionRange = document.createRange();
        mentionRange.setStart(node, start);
        mentionRange.setEnd(node, sel.anchorOffset);

        var items = matchContacts(match[2]);
        var query = match[2].toLowerCase();
        if (EMAIL_RE.test(query) && !items.some(function (c) { return c.email === query; })) {
            items.unshift({ email: query, name: nameFromEmail(query) });
        }
        var rect = mentionRange.getBoundingClientRect();
        showSuggestions(items, rect, insertMention);
    }

    function insertMention(contact) {
        if (!mentionRange) return;
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(mentionRange);
        document.execCommand("insertHTML", false,
            '<a class="mention" href="mailto:' + escapeHtml(contact.email) + '">@' + escapeHtml(contact.name) + "</a>&nbsp;");
        mentionRange = null;
        saveSelection();

        var all = recipients.to.list.concat(recipients.cc.list, recipients.bcc.list);
        if (all.indexOf(contact.email) === -1) {
            rememberLocalContact(contact.email);
            addRecipient(recipients.to, contact.email);
            toast("Added " + contact.name + " to To");
        }
    }

    editor.addEventListener("keydown", function (e) { handleSuggestionKey(e); });

    // ================= Attachments =================
    var selectedFiles = [];

    function addFiles(input) {
        for (var i = 0; i < input.files.length; i++) {
            selectedFiles.push(input.files[i]);
        }
        input.value = ""; // allow picking the same file again after removing it
        renderAttachments();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        renderAttachments();
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function renderAttachments() {
        var list = document.getElementById("attachment-list");
        list.innerHTML = "";
        selectedFiles.forEach(function (file, index) {
            var item = document.createElement("li");
            item.className = "chip";

            var name = document.createElement("span");
            name.className = "chip-name";
            name.textContent = file.name;
            name.title = file.name;

            var size = document.createElement("span");
            size.className = "chip-size";
            size.textContent = formatSize(file.size);

            var remove = document.createElement("button");
            remove.textContent = "\u00d7";
            remove.title = "Remove";
            remove.onclick = function () { removeFile(index); };

            item.appendChild(name);
            item.appendChild(size);
            item.appendChild(remove);
            list.appendChild(item);
        });
    }

    // ================= Polish / send / schedule =================
    function setEmailStatus(text, type) {
        var status = document.getElementById("email-status");
        status.textContent = text;
        status.className = type || "";
    }

    function textToHtml(text) {
        return text.split(/\n{2,}/).map(function (para) {
            return "<div>" + escapeHtml(para).replace(/\n/g, "<br>") + "</div><div><br></div>";
        }).join("");
    }

    function polishEmail() {
        stopListening();
        var subject = document.getElementById("email-subject").value;
        var body = editorText();
        if (!subject.trim() && !body) {
            setEmailStatus("Write a subject or message first.", "error");
            return;
        }
        var signature = editor.querySelector(".jarvis-signature");
        if (signature) body = editorTextWithout(signature);

        var btn = document.getElementById("polish-btn");
        btn.disabled = true;
        setEmailStatus("Polishing your email...");

        fetch("/polish_email", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subject: subject, body: body })
        })
        .then(function (response) { return response.json(); })
        .then(function (data) {
            if (data.error) {
                setEmailStatus(data.error, "error");
                return;
            }
            document.getElementById("email-subject").value = data.subject;
            var sigHtml = signature ? signature.outerHTML : "";
            editor.innerHTML = textToHtml(data.body) + sigHtml;
            setEmailStatus("Polished. Review it, then click Send.", "success");
        })
        .catch(function (error) { setEmailStatus("Error: " + error, "error"); })
        .finally(function () { btn.disabled = false; });
    }

    function editorTextWithout(node) {
        var clone = editor.cloneNode(true);
        var sig = clone.querySelector(".jarvis-signature");
        if (sig) sig.remove();
        document.body.appendChild(clone);
        clone.style.position = "absolute";
        clone.style.left = "-9999px";
        var text = clone.innerText.trim();
        clone.remove();
        return text;
    }

    function collectEmail() {
        ["to", "cc", "bcc"].forEach(function (name) {
            if (recipients[name].input.value.trim()) commitRecipientInput(recipients[name]);
        });
        var invalid = recipients.to.list.concat(recipients.cc.list, recipients.bcc.list)
            .filter(function (a) { return !EMAIL_RE.test(a); });
        if (invalid.length) {
            setEmailStatus("Fix the invalid address: " + invalid.join(", "), "error");
            return null;
        }
        if (!recipients.to.list.length) {
            setEmailStatus("Please add at least one recipient in To.", "error");
            recipients.to.input.focus();
            return null;
        }
        var formData = new FormData();
        formData.append("to", recipients.to.list.join(", "));
        formData.append("cc", recipients.cc.list.join(", "));
        formData.append("bcc", recipients.bcc.list.join(", "));
        formData.append("subject", document.getElementById("email-subject").value);
        formData.append("body", editorText());
        formData.append("html", editor.innerHTML);
        selectedFiles.forEach(function (file) { formData.append("attachments", file); });
        return formData;
    }

    function sendEmail(sendAt) {
        stopListening();
        closePopovers();
        var formData = collectEmail();
        if (!formData) return;
        if (sendAt) formData.append("send_at", sendAt);

        var btn = document.getElementById("send-email-btn");
        btn.disabled = true;
        setEmailStatus(sendAt ? "Scheduling..." : "Sending...");

        fetch("/send_email", { method: "POST", body: formData })
        .then(function (response) { return response.json(); })
        .then(function (data) {
            var ok = data.scheduled || (data.response && data.response.indexOf("Email sent") === 0);
            setEmailStatus(data.response, ok ? "success" : "error");
            if (ok) {
                recipients.to.list.concat(recipients.cc.list, recipients.bcc.list).forEach(rememberLocalContact);
                clearCompose();
                toast(data.scheduled ? "Email scheduled" : "Email sent");
                if (data.scheduled) loadScheduled();
            }
        })
        .catch(function (error) { setEmailStatus("Error: " + error, "error"); })
        .finally(function () { btn.disabled = false; });
    }

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function toLocalInput(d) {
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    function openSchedule(anchor) {
        var now = new Date();
        var tomorrow8 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 8, 0);
        var tomorrow13 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 13, 0);
        var daysToMonday = ((8 - now.getDay()) % 7) || 7;
        var monday8 = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysToMonday, 8, 0);
        var presets = [["Tomorrow morning", tomorrow8], ["Tomorrow afternoon", tomorrow13], ["Monday morning", monday8]];

        var box = document.getElementById("schedule-presets");
        box.innerHTML = "";
        presets.forEach(function (p) {
            var b = document.createElement("button");
            b.className = "menu-item";
            b.innerHTML = escapeHtml(p[0]) + "<small>" + escapeHtml(p[1].toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })) + "</small>";
            b.onclick = function () { sendEmail(toLocalInput(p[1])); };
            box.appendChild(b);
        });
        var picker = document.getElementById("schedule-at");
        picker.min = toLocalInput(now);
        picker.value = toLocalInput(new Date(now.getTime() + 60 * 60 * 1000));
        openPopover("schedule-popover", anchor);
    }

    function scheduleFromPicker() {
        var value = document.getElementById("schedule-at").value;
        if (!value) return;
        sendEmail(value);
    }

    function loadScheduled() {
        fetch("/scheduled").then(function (r) { return r.json(); }).then(function (items) {
            var box = document.getElementById("scheduled-box");
            var list = document.getElementById("scheduled-list");
            box.style.display = items.length ? "block" : "none";
            list.innerHTML = "";
            items.forEach(function (item) {
                var row = document.createElement("div");
                row.className = "scheduled-item";
                var when = document.createElement("span");
                when.className = "when";
                when.textContent = new Date(item.send_at.replace(" ", "T")).toLocaleString([], { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
                var what = document.createElement("span");
                what.className = "what";
                what.textContent = (item.subject || "(no subject)") + " \u2014 to " + item.to + (item.error ? "  (" + item.error + ")" : "");
                var cancel = document.createElement("button");
                cancel.className = "btn btn-ghost";
                cancel.textContent = "Cancel";
                cancel.onclick = function () {
                    fetch("/scheduled/" + item.id, { method: "DELETE" }).then(loadScheduled);
                };
                row.appendChild(when);
                row.appendChild(what);
                row.appendChild(cancel);
                list.appendChild(row);
            });
        }).catch(function () {});
    }

    function clearCompose() {
        ["to", "cc", "bcc"].forEach(function (name) {
            recipients[name].list = [];
            recipients[name].input.value = "";
            renderRecipients(recipients[name]);
        });
        document.getElementById("cc-row").classList.add("hidden");
        document.getElementById("bcc-row").classList.add("hidden");
        document.getElementById("show-cc").classList.remove("hidden");
        document.getElementById("show-bcc").classList.remove("hidden");
        document.getElementById("email-subject").value = "";
        editor.innerHTML = "";
        savedRange = null;
        selectedFiles = [];
        renderAttachments();
    }

    function discardEmail() {
        stopListening();
        var hasContent = recipients.to.list.length || recipients.cc.list.length || recipients.bcc.list.length ||
                         document.getElementById("email-subject").value || editorText() || selectedFiles.length;
        if (hasContent && !confirm("Discard this email?")) return;
        clearCompose();
        setEmailStatus("");
    }

    // ================= Tasks =================
    var tasks = [];
    var taskStatus = {};
    var taskFilter = "all";
    var tasksTimer = null;

    function todayString() {
        var d = new Date();
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function isOverdue(t) {
        return t.status !== "Completed" && t.deadline && t.deadline.slice(0, 10) < todayString();
    }

    function statusClass(s) {
        return s === "Completed" ? "completed" : s === "In Progress" ? "in-progress" : "not-started";
    }

    function formatDate(value, withTime) {
        if (!value) return "";
        var d = new Date(value.length > 10 ? value.replace(" ", "T") : value + "T00:00");
        if (isNaN(d)) return value;
        var opts = { day: "numeric", month: "short", year: "numeric" };
        if (withTime && value.length > 10) { opts.hour = "numeric"; opts.minute = "2-digit"; }
        return d.toLocaleString([], opts);
    }

    function loadTasks() {
        return fetch("/tasks").then(function (r) { return r.json(); }).then(function (data) {
            tasks = data.tasks;
            taskStatus = data.status;
            renderTasks();
            renderTaskStatus();
            scheduleTaskRefresh();
        }).catch(function () {});
    }

    function refreshTaskBadge() {
        fetch("/tasks").then(function (r) { return r.json(); }).then(function (data) {
            tasks = data.tasks;
            taskStatus = data.status;
            updateBadge();
            if (currentView === "tasks") { renderTasks(); renderTaskStatus(); }
        }).catch(function () {});
    }

    function scheduleTaskRefresh() {
        clearTimeout(tasksTimer);
        if (currentView !== "tasks") return;
        tasksTimer = setTimeout(loadTasks, taskStatus.running ? 3000 : 15000);
    }

    function updateBadge() {
        var open = tasks.filter(function (t) { return t.status !== "Completed"; }).length;
        document.getElementById("tasks-badge").textContent = open ? open : "";
    }

    function setTaskFilter(filter) {
        taskFilter = filter;
        document.querySelectorAll(".stat-card").forEach(function (c) {
            c.classList.toggle("active", c.dataset.filter === filter);
        });
        renderTasks();
    }

    function renderTaskStatus() {
        var s = taskStatus;
        var setup = document.getElementById("tasks-setup-banner");
        if (!s.configured) {
            setup.innerHTML = "<b>Almost ready.</b> Add your managers' email addresses to <code>TASK_MANAGERS</code> in the <code>.env</code> file " +
                "(comma-separated), then restart Jarvis. Tasks are saved to <code>" + escapeHtml(s.file || "") + "</code>.";
            setup.classList.add("show");
        } else {
            setup.classList.remove("show");
        }

        var warn = document.getElementById("tasks-warn-banner");
        var warnings = [];
        if (s.file_error) warnings.push(escapeHtml(s.file_error));
        if (s.pending_changes) warnings.push(s.pending_changes + " change(s) are waiting to be saved to Excel.");
        warn.innerHTML = warnings.join(" ");
        warn.classList.toggle("show", warnings.length > 0);

        var info = [];
        if (s.running) info.push(s.progress || "Checking email...");
        else if (s.last_check) info.push("Last checked " + formatDate(s.last_check, true));
        if (s.message && !s.running && s.configured) info.push(s.message);
        if (s.configured) info.push("Checks every " + s.check_minutes + " min");
        document.getElementById("sync-info").innerHTML = info.map(escapeHtml).join("<br>");
        document.getElementById("check-now-btn").disabled = !!s.running || !s.configured;
    }

    function renderTasks() {
        updateBadge();
        var counts = { all: tasks.length, "Not Started": 0, "In Progress": 0, Completed: 0, overdue: 0 };
        tasks.forEach(function (t) {
            counts[t.status || "Not Started"] = (counts[t.status || "Not Started"] || 0) + 1;
            if (isOverdue(t)) counts.overdue++;
        });
        document.getElementById("count-all").textContent = counts.all;
        document.getElementById("count-not-started").textContent = counts["Not Started"];
        document.getElementById("count-in-progress").textContent = counts["In Progress"];
        document.getElementById("count-completed").textContent = counts.Completed;
        document.getElementById("count-overdue").textContent = counts.overdue;

        var query = document.getElementById("task-search").value.trim().toLowerCase();
        var visible = tasks.filter(function (t) {
            if (taskFilter === "overdue" && !isOverdue(t)) return false;
            if (taskFilter !== "all" && taskFilter !== "overdue" && (t.status || "Not Started") !== taskFilter) return false;
            if (query) {
                var hay = [t.id, t.task, t.details, t.from, t.subject, t.note].join(" ").toLowerCase();
                if (hay.indexOf(query) === -1) return false;
            }
            return true;
        });

        var container = document.getElementById("tasks-container");
        if (!visible.length) {
            container.innerHTML = '<div class="empty-state">' +
                (tasks.length ? "No tasks match this filter." : "No tasks yet. When your managers email you tasks, they'll appear here.") + "</div>";
            return;
        }

        var rows = visible.map(function (t) {
            var status = t.status || "Not Started";
            var fromName = (t.from || "").replace(/\s*<[^>]*>\s*/, "").trim() || t.from;
            var deadline = t.deadline ? formatDate(t.deadline.slice(0, 10)) : '<span class="muted">\u2014</span>';
            if (isOverdue(t)) deadline = '<span class="overdue-text">' + deadline + "</span>";
            var options = ["Not Started", "In Progress", "Completed"].map(function (s) {
                return '<option' + (s === status ? " selected" : "") + ">" + s + "</option>";
            }).join("");
            var replyInfo = status === "Completed"
                ? (t.reply_sent === "Yes" ? "\u2713 Reply sent" : (t.message_id ? "Reply pending" : "No email to reply to"))
                : "";
            return '<tr class="' + (isOverdue(t) ? "overdue" : "") + '">' +
                '<td class="task-id">' + escapeHtml(t.id) + "</td>" +
                "<td>" +
                    '<div class="task-title">' + escapeHtml(t.task) + "</div>" +
                    (t.details ? '<div class="task-details">' + escapeHtml(t.details) + "</div>" : "") +
                    '<div class="task-from">From ' + escapeHtml(fromName || "unknown") + (t.subject ? " \u00b7 " + escapeHtml(t.subject) : "") + "</div>" +
                    (t.note ? '<div class="task-note">Note: ' + escapeHtml(t.note) + "</div>" : "") +
                "</td>" +
                '<td class="nowrap hide-sm">' + escapeHtml(formatDate(t.received, true)) + "</td>" +
                '<td class="nowrap">' + deadline + "</td>" +
                '<td class="hide-sm">' + (t.priority ? '<span class="priority ' + escapeHtml(t.priority) + '">' + escapeHtml(t.priority) + "</span>" : "") + "</td>" +
                "<td>" +
                    '<select class="status-select ' + statusClass(status) + '" data-id="' + escapeHtml(t.id) + '" data-current="' + escapeHtml(status) + '" onchange="onStatusChange(this)">' + options + "</select>" +
                    (replyInfo ? '<div class="reply-flag">' + replyInfo + "</div>" : "") +
                "</td>" +
                '<td class="nowrap hide-sm">' + (t.completed_on ? escapeHtml(formatDate(t.completed_on, true)) : '<span class="muted">\u2014</span>') + "</td>" +
            "</tr>";
        }).join("");

        container.innerHTML = '<table class="task-table"><thead><tr>' +
            '<th>ID</th><th>Task</th><th class="hide-sm">Received</th><th>Deadline</th><th class="hide-sm">Priority</th><th>Status</th><th class="hide-sm">Completed</th>' +
            "</tr></thead><tbody>" + rows + "</tbody></table>";
    }

    var pendingCompletion = null;

    function onStatusChange(select) {
        var id = select.dataset.id;
        var status = select.value;
        if (status === "Completed") {
            var task = tasks.find(function (t) { return t.id === id; });
            pendingCompletion = { select: select, id: id };
            document.getElementById("complete-title").textContent = "Complete " + id + ": " + (task ? task.task : "");
            document.getElementById("complete-desc").textContent = task && task.message_id
                ? "Jarvis will reply to " + ((task.from || "").replace(/\s*<[^>]*>\s*/, "") || "your manager") + "'s original email to say this task is done."
                : "This task has no original email, so no reply will be sent.";
            document.getElementById("complete-note").value = task && task.note ? task.note : "";
            document.getElementById("complete-modal").classList.add("open");
            document.getElementById("complete-note").focus();
            return;
        }
        updateTaskStatus(id, status, null, select);
    }

    function closeCompleteModal(confirmed) {
        document.getElementById("complete-modal").classList.remove("open");
        if (!pendingCompletion) return;
        var p = pendingCompletion;
        pendingCompletion = null;
        if (confirmed) {
            updateTaskStatus(p.id, "Completed", document.getElementById("complete-note").value, p.select);
        } else {
            p.select.value = p.select.dataset.current;
        }
    }

    function updateTaskStatus(id, status, note, select) {
        select.disabled = true;
        toast(status === "Completed" ? "Marking " + id + " completed and replying..." : "Updating " + id + "...");
        fetch("/tasks/" + encodeURIComponent(id) + "/status", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ status: status, note: note })
        })
        .then(function (r) { return r.json(); })
        .then(function (data) { toast(data.response); })
        .catch(function (error) { toast("Error: " + error); })
        .finally(function () { loadTasks(); });
    }

    function checkTasksNow() {
        fetch("/tasks/check", { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            toast(data.response);
            taskStatus.running = true;
            renderTaskStatus();
            setTimeout(loadTasks, 1500);
        });
    }

    // ================= Start =================
    addMessage("jarvis", "Hello Boss. How can I help you today?");
    messageInput.focus();
    loadContacts();
    refreshTaskBadge();
    setInterval(function () { if (currentView !== "tasks") refreshTaskBadge(); }, 60000);
</script>
</body>
</html>
